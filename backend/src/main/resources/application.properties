spring.application.name=backend

# Datasource (Neon Postgres) — provided via env vars
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/supportflow}
spring.datasource.username=${DATABASE_USERNAME:supportflow}
spring.datasource.password=${DATABASE_PASSWORD:supportflow}

# JPA — Flyway owns the schema; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Actuator — expose health only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
