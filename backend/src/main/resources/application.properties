spring.application.name=backend

# Local dev overrides — if application-local.properties is on the classpath it is loaded on top
# of this file (gitignored, contains real secrets). In production the file isn't there and Spring
# silently skips it, falling through to the env-var defaults below.
spring.config.import=optional:classpath:application-local.properties

# Datasource (Neon Postgres) — provided via env vars
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/supportflow}
spring.datasource.username=${DATABASE_USERNAME:supportflow}
spring.datasource.password=${DATABASE_PASSWORD:supportflow}

# Errors — return RFC 9457 ProblemDetail for Spring MVC's built-in exceptions
spring.mvc.problemdetails.enabled=true

# JPA — Flyway owns the schema; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Actuator — expose health only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Auth — app-issued JWT and sign-in allowlist (provided via env vars)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.auth.allowlist=${AUTH_ALLOWLIST:}

# OAuth2 login (Google + GitHub). Credentials come from env vars; when they are
# absent the oauth2Login filter is skipped (see SecurityConfig) so local dev still starts.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.github.client-id=${GITHUB_OAUTH_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# Where to send the browser after the OAuth dance. Success carries the JWT in the
# URL fragment (#token=...); the SPA reads it, stores it in memory, and clears the URL.
app.oauth.success-redirect=${OAUTH_SUCCESS_REDIRECT:http://localhost:5173/oauth/callback}
app.oauth.failure-redirect=${OAUTH_FAILURE_REDIRECT:http://localhost:5173/login}

# CORS — browser origins allowed to call this API (the SPA). Comma-separated for more than one.
# Local default covers the Vite dev server (5173) and the production-build preview (4173); set
# FRONTEND_ORIGIN to the Vercel URL in production.
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173,http://localhost:4173}

# AI advisor (Gemini)
supportflow.ai.gemini.api-key=${GEMINI_API_KEY:}
supportflow.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
supportflow.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
# Retry transient Gemini failures (5xx / network). The free tier returns HTTP 503 "model overloaded"
# intermittently; a 503 doesn't consume quota, so a bounded retry with backoff is safe.
supportflow.ai.gemini.max-attempts=${GEMINI_MAX_ATTEMPTS:3}
supportflow.ai.gemini.retry-backoff-ms=${GEMINI_RETRY_BACKOFF_MS:1000}
# Total wall-clock budget for the retry loop. Each failed attempt can burn the full read timeout,
# so this caps how long a hung upstream can block the (synchronous) request before we give up.
supportflow.ai.gemini.retry-max-elapsed-ms=${GEMINI_RETRY_MAX_ELAPSED_MS:30000}

# Escalation integrations (Jira + Qase + Confluence). Jira and Confluence share one Atlassian
# account (Basic email:token); Qase uses its own token header. Which Jira project / Qase project /
# Confluence space to target is per-Project in the DB — these are only the shared credentials and
# site URLs. `client=real` hits the real APIs; tests swap in fakes via `=fake` (see GeminiClient).
supportflow.integrations.client=${INTEGRATIONS_CLIENT:real}
# Base URL the external records link back to (a SupportFlow ticket). Placeholder until the app is
# hosted; set APP_BASE_URL to the deployed frontend URL at Phase 4 with no code change.
supportflow.app.base-url=${APP_BASE_URL:http://localhost:5173}
supportflow.integrations.atlassian.email=${ATLASSIAN_EMAIL:}
supportflow.integrations.atlassian.api-token=${ATLASSIAN_API_TOKEN:}
supportflow.integrations.jira.base-url=${JIRA_BASE_URL:}
# Jira issue type created on escalation. "Bug" exists in default Jira projects; override if your
# project renamed it. SupportFlow priority is NOT mapped onto Jira's priority field (scheme names
# vary per project and an unknown value fails issue creation) — it goes in the description instead.
supportflow.integrations.jira.issue-type=${JIRA_ISSUE_TYPE:Bug}
supportflow.integrations.confluence.base-url=${CONFLUENCE_BASE_URL:}
supportflow.integrations.qase.base-url=${QASE_BASE_URL:https://api.qase.io/v1}
supportflow.integrations.qase.app-url=${QASE_APP_URL:https://app.qase.io}
supportflow.integrations.qase.api-token=${QASE_API_TOKEN:}

# Pagination defaults — bind ?page=&size=&sort= to Pageable controller params. The max-page-size
# cap stops clients from requesting size=999999 and DoS'ing us with one query.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Java 21 virtual threads — Spring Boot 3.2+ uses them for the Tomcat request executor
# and @Async / scheduled tasks when this flag is on. Cheap to enable; big wins for I/O-bound work.
spring.threads.virtual.enabled=true
