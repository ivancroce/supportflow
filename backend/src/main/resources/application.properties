spring.application.name=backend

# Local dev overrides — if application-local.properties is on the classpath it is loaded on top
# of this file (gitignored, contains real secrets). In production the file isn't there and Spring
# silently skips it, falling through to the env-var defaults below.
spring.config.import=optional:classpath:application-local.properties

# Datasource (Neon Postgres) — provided via env vars
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/supportflow}
spring.datasource.username=${DATABASE_USERNAME:supportflow}
spring.datasource.password=${DATABASE_PASSWORD:supportflow}

# Errors — return RFC 9457 ProblemDetail for Spring MVC's built-in exceptions
spring.mvc.problemdetails.enabled=true

# JPA — Flyway owns the schema; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Actuator — expose health only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Auth — app-issued JWT and sign-in allowlist (provided via env vars)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.auth.allowlist=${AUTH_ALLOWLIST:}

# OAuth2 login (Google + GitHub). Credentials come from env vars; when they are
# absent the oauth2Login filter is skipped (see SecurityConfig) so local dev still starts.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.github.client-id=${GITHUB_OAUTH_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# Where to send the browser after the OAuth dance. Success carries the JWT in the
# URL fragment (#token=...); the SPA reads it, stores it in memory, and clears the URL.
app.oauth.success-redirect=${OAUTH_SUCCESS_REDIRECT:http://localhost:5173/oauth/callback}
app.oauth.failure-redirect=${OAUTH_FAILURE_REDIRECT:http://localhost:5173/login}

# AI advisor (Gemini)
supportflow.ai.gemini.api-key=${GEMINI_API_KEY:}
supportflow.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
supportflow.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# Pagination defaults — bind ?page=&size=&sort= to Pageable controller params. The max-page-size
# cap stops clients from requesting size=999999 and DoS'ing us with one query.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Java 21 virtual threads — Spring Boot 3.2+ uses them for the Tomcat request executor
# and @Async / scheduled tasks when this flag is on. Cheap to enable; big wins for I/O-bound work.
spring.threads.virtual.enabled=true
