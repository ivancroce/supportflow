spring.application.name=backend

# Datasource (Neon Postgres) — provided via env vars
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/supportflow}
spring.datasource.username=${DATABASE_USERNAME:supportflow}
spring.datasource.password=${DATABASE_PASSWORD:supportflow}

# Errors — return RFC 9457 ProblemDetail for Spring MVC's built-in exceptions
spring.mvc.problemdetails.enabled=true

# JPA — Flyway owns the schema; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Actuator — expose health only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Auth — app-issued JWT and sign-in allowlist (provided via env vars)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.auth.allowlist=${AUTH_ALLOWLIST:}
