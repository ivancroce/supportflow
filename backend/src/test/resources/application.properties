spring.application.name=backend-test

# H2 in PostgreSQL compatibility mode; Hibernate builds the schema from entities.
spring.datasource.url=jdbc:h2:mem:supportflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Skip Flyway (V1__init.sql is Postgres-specific: pgcrypto, timestamptz).
spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true

# Auth — fixed test values so the JWT/auth beans wire up.
app.jwt.secret=test-secret-please-ignore-this-is-only-for-tests-0123456789
app.jwt.expiration-ms=86400000
app.auth.allowlist=test@example.com

# OAuth — supply dummy client credentials so OAuth2ClientProperties.validate() passes;
# SecurityConfig will still wire oauth2Login but no real provider is contacted by these tests.
spring.security.oauth2.client.registration.google.client-id=test-google
spring.security.oauth2.client.registration.google.client-secret=test-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.github.client-id=test-github
spring.security.oauth2.client.registration.github.client-secret=test-secret
spring.security.oauth2.client.registration.github.scope=read:user,user:email

app.oauth.success-redirect=http://localhost:5173/oauth/callback
app.oauth.failure-redirect=http://localhost:5173/login
